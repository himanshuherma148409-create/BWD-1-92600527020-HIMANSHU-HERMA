<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Same Page Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            scroll-behavior: smooth;
            background-color: #f4f4f4;
        }

        header {
            background-color: #007BFF;
            padding: 15px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        header a:hover {
            text-decoration: underline;
        }

        section {
            height: 100vh;
            padding: 40px;
            border-bottom: 2px solid #ddd;
        }

        #home {
            background-color: #e3f2fd;
        }

        #about {
            background-color: #fff3cd;
        }

        #services {
            background-color: #d4edda;
        }

        #contact {
            background-color: #f8d7da;
        }

        h2 {
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </header>

    <section id="home">
        <h2>Home</h2>
        <p>Welcome to the Home section.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>This is the About section.</p>
    </section>

    <section id="services">
        <h2>Services</h2>
        <p>Information about our services.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Contact us here.</p>
    </section>

</body>
</html>
